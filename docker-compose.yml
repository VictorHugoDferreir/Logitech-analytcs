version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: logitech_postgres
    restart: always
    environment:
      POSTGRES_DB: logitech_analytics
      POSTGRES_USER: data_analyst
      POSTGRES_PASSWORD: analyst_password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: